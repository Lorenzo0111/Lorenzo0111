<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Got something to build? Let's talk">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic;font-weight:400}
  </style>
  <rect width="1000" height="180" rx="18" fill="#141414"/><rect x=".5" y=".5" width="999" height="179" rx="17.5" fill="none" stroke="#2a2a2a"/>
  <defs><radialGradient id="g" cx="85%" cy="50%" r="55%"><stop offset="0" stop-color="#fcba03" stop-opacity=".16"/><stop offset="1" stop-color="#fcba03" stop-opacity="0"/></radialGradient></defs>
  <rect width="1000" height="180" rx="18" fill="url(#g)"/>
  <text x="48" y="58" class="mono" font-size="13" letter-spacing="3" fill="#fcba03">05 — SAY HI</text>
  <text x="48" y="108" class="sans" font-size="38" font-weight="700" letter-spacing="-.5" fill="#fff">Got something to <tspan class="serif" font-size="46" letter-spacing="0" fill="#fcba03">build?</tspan></text>
  <text x="48" y="142" class="sans" font-size="16" fill="#8a8a8a">Freelance, collabs, or just to chat — my inbox is open.</text>
  <g transform="translate(740 64)">
    <rect y="6" width="212" height="56" rx="14" fill="#b88600"/>
    <rect width="212" height="54" rx="14" fill="#fcba03" stroke="#ffd85c"/>
    <text x="106" y="34" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#241900">Let's talk  →</text>
  </g>
</svg>
